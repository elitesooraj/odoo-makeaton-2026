openapi: 3.0.3
info:
  title: Brightloop Subscription Management API
  version: 0.1.0
  description: |
    Foundation endpoints implemented by Experienced Member 1.

    Conventions:
    - Every response is `{ data, meta }` or `{ error }`.
    - Authentication is a server-side session in the `bl_session` cookie.
      Browser clients must send `credentials: 'include'`.
    - Errors use the codes in `docs/CONVENTIONS.md`.

    Member 2 appends product, plan, subscription, invoice, payment, tax and
    discount paths to this file before building them.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Customers
  - name: Permissions

security:
  - cookieAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      description: Creates the customer and the CUSTOMER login in one transaction, then starts a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear the session cookie
      security: []
      responses:
        '204':
          description: Session revoked

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: Always returns 202, whether or not the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Request accepted

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: Password changed and all sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, flags and effective permissions
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed; other sessions revoked
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the email verification link
      responses:
        '204':
          description: Accepted (no-op when already verified)

  /permissions:
    get:
      tags: [Permissions]
      summary: List the permission catalog
      description: Requires `users.read`.
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [Users]
      summary: List internal users
      description: Requires `users.read`. Customer portal logins are excluded unless `role=CUSTOMER` is passed explicitly.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string, enum: [ADMIN, STAFF, CUSTOMER] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a staff or admin user
      description: |
        Requires `users.write`. The server generates a temporary password and
        returns it once; the user must change it at first login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      temporary_password:
                        type: string
                        description: Shown once. Never returned again.
                  meta: { $ref: '#/components/schemas/Meta' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Users]
      summary: Get a user with permissions and overrides
      description: Requires `users.read`.
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update name, role or status
      description: Requires `users.write`. You cannot change your own role or disable yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      tags: [Users]
      summary: Replace a staff member's permission overrides
      description: |
        Requires `users.write`. The list replaces all existing overrides;
        sending an empty list resets the user to role defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPermissionsRequest' }
      responses:
        '200':
          description: Effective permissions after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      permissions:
                        type: array
                        items: { type: string }
                  meta: { $ref: '#/components/schemas/Meta' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: Requires `customers.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Matches name or email
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: Paged customers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerListResponse' }
    post:
      tags: [Customers]
      summary: Create a customer
      description: Requires `customers.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomerID'
    get:
      tags: [Customers]
      summary: Get a customer
      description: Requires `customers.read`.
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Customers]
      summary: Update a customer
      description: Requires `customers.write`. All fields are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Customers]
      summary: Deactivate a customer
      description: Requires `customers.write`. Soft delete; the row is never removed.
      responses:
        '200':
          description: Customer marked INACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bl_session

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Uniqueness or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Field validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
      additionalProperties: true

    ListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
            request_id: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [ADMIN, STAFF, CUSTOMER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        customer_id: { type: string, format: uuid, nullable: true }
        email_verified: { type: boolean }
        must_change_password: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Permission:
      type: object
      properties:
        key: { type: string }
        category: { type: string }
        description: { type: string }

    UserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/Meta' }

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/ListMeta' }

    UserDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            permissions:
              type: array
              items: { type: string }
            overrides:
              type: object
              additionalProperties:
                type: string
                enum: [GRANT, REVOKE]
        meta: { $ref: '#/components/schemas/Meta' }

    MeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            permissions:
              type: array
              items: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        billing_address:
          type: object
          additionalProperties: true
        tax_id: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Customer' }
        meta: { $ref: '#/components/schemas/Meta' }

    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        meta: { $ref: '#/components/schemas/ListMeta' }

    RegisterRequest:
      type: object
      required: [email, password, company_name]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          description: Longer than 8 characters, upper, lower and special; max 72 bytes.
        company_name: { type: string }
        full_name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [STAFF, ADMIN], default: STAFF }

    UpdateUserRequest:
      type: object
      properties:
        full_name: { type: string }
        role: { type: string, enum: [STAFF, ADMIN] }
        status: { type: string, enum: [ACTIVE, DISABLED] }

    SetPermissionsRequest:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          items:
            type: object
            required: [permission, effect]
            properties:
              permission: { type: string }
              effect: { type: string, enum: [GRANT, REVOKE] }

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        billing_address:
          type: object
          additionalProperties: true
        tax_id: { type: string }
        notes: { type: string }

    UpdateCustomerRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        billing_address:
          type: object
          additionalProperties: true
        tax_id: { type: string }
        notes: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
